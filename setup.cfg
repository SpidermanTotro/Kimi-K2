[tool:pytest]
testpaths = src/kimi_k2/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=kimi_k2
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=90
asyncio_mode = auto

[coverage:run]
source = src/kimi_k2
omit = 
    */tests/*
    */ui/*
    */cli/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
