# Kimi K2 Service
# THE FORGE AI - Phase 4: Production Deployment

apiVersion: v1
kind: Service
metadata:
  name: kimi-k2-service
  namespace: kimi-k2
  labels:
    app: kimi-k2
spec:
  type: LoadBalancer
  selector:
    app: kimi-k2
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
